<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposal Page</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin-top: 100px;
  /* Background image */
  background-image: url('roses.jpg'); /* lots of roses image */
  background-size: cover;      /* cover entire screen */
  background-repeat: no-repeat;
  background-position: center;
  background-attachment: fixed; /* stays fixed while scrolling */
  color: white;                /* text color to contrast with roses */
}
    h1 { color: pink; font-size: 2em; }
    button {
      font-size: 20px;
      padding: 12px 25px;
      margin: 15px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    #yesBtn { background-color: #4CAF50; color: white; }
    #noBtn { background-color: #f44336; color: white; }

    /* Bounce animation for the heading */
h1 {
  animation: bounce 5s infinite;
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-20px); }
  60% { transform: translateY(-10px); }
}

button:hover {
  transform: scale(1.1);
  transition: transform 0.2s;
}
  </style>
</head>
<body>

<h1>Will you accept my proposal?</h1>

<button id="yesBtn" onclick="window.location.href='Yes.html'">Yes</button>
<button id="noBtn" onclick="window.location.href='No.html'">No</button>


<style>
/* Heart style */
.heart {
  position: fixed;
  bottom: -50px;
  color: rgb(255, 0, 170);
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0.8;
}

/* Floating animation */
@keyframes floatUp {
  0% {
    transform: translateY(0) scale(0.8);
    opacity: 0;
  }
  10% { opacity: 1; }
  100% {
    transform: translateY(-110vh) scale(1.4);
    opacity: 0;
  }
}
</style>

<script>
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = ["❤️"];

    // random position
    heart.style.left = Math.random() * 100 + "vw";

    // random size
    heart.style.fontSize = (15 + Math.random() * 35) + "px";

    // random speed
    heart.style.animationDuration = (3 + Math.random() * 5) + "s";

    document.body.appendChild(heart);

    // remove after animation
    setTimeout(() => {
        heart.remove();
    }, 8000);
}

// create hearts continuously
setInterval(createHeart, 50);
</script>

</body>
</html>
